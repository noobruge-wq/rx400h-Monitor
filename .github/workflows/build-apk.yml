name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # This source package does not include Gradle Wrapper binaries.
      # Install the exact Gradle version required by AGP 8.7.3.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK_PATH="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" "dist/RX400hProtocolProbe-v0.1.6-debug.apk"
          sha256sum "dist/RX400hProtocolProbe-v0.1.6-debug.apk" > "dist/SHA256SUMS.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RX400hProtocolProbe-v0.1.6-debug
          path: dist/
          if-no-files-found: error
          retention-days: 30
