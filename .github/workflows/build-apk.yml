name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build signed debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build signed debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Locate Android apksigner
        id: apksigner
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          echo "path=$APKSIGNER" >> "$GITHUB_OUTPUT"

      - name: Verify signature and collect APK
        shell: bash
        env:
          APKSIGNER: ${{ steps.apksigner.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p dist
          APK_PATH="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"

          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH" | tee dist/APK_SIGNATURE.txt
          "$APKSIGNER" verify "$APK_PATH"

          cp "$APK_PATH" "dist/RX400hProtocolProbe-v0.3.0-header-v3-debug-signed.apk"
          sha256sum "dist/RX400hProtocolProbe-v0.3.0-header-v3-debug-signed.apk" > dist/SHA256SUMS.txt

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: RX400hProtocolProbe-v0.3.0-header-v3-debug-signed
          path: dist/
          if-no-files-found: error
          retention-days: 30
