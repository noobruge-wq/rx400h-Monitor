<div id="rx400h-font-comparison">
  <h2>RX400h 中文小字号对比</h2>
  <p class="text-muted">同一组文字、同一荧光色、无辉光。逻辑像素方案先栅格化再 2× 放大；物理像素方案直接在 1280×720 层绘制。</p>
  <div class="rx400h-font-rows" aria-live="polite">
    <section class="rx400h-font-row">
      <div><strong>当前基线</strong><br><span class="text-muted">微软雅黑 UI · 9 逻辑像素</span></div>
      <canvas data-family="Microsoft YaHei UI" data-size="9" data-mode="logical" width="640" height="72" role="img" aria-label="微软雅黑 UI 九逻辑像素中文示例"></canvas>
    </section>
    <section class="rx400h-font-row">
      <div><strong>Noto Sans SC</strong><br><span class="text-muted">9 逻辑像素 → 18 物理像素</span></div>
      <canvas data-family="Noto Sans SC" data-size="9" data-mode="logical" width="640" height="72" role="img" aria-label="Noto Sans SC 九逻辑像素中文示例"></canvas>
    </section>
    <section class="rx400h-font-row">
      <div><strong>Noto Sans SC</strong><br><span class="text-muted">10 逻辑像素 → 20 物理像素</span></div>
      <canvas data-family="Noto Sans SC" data-size="10" data-mode="logical" width="640" height="72" role="img" aria-label="Noto Sans SC 十逻辑像素中文示例"></canvas>
    </section>
    <section class="rx400h-font-row">
      <div><strong>Noto Sans SC</strong><br><span class="text-muted">11 逻辑像素 → 22 物理像素</span></div>
      <canvas data-family="Noto Sans SC" data-size="11" data-mode="logical" width="640" height="72" role="img" aria-label="Noto Sans SC 十一逻辑像素中文示例"></canvas>
    </section>
    <section class="rx400h-font-row">
      <div><strong>Noto Sans SC</strong><br><span class="text-muted">18 物理像素直接绘制</span></div>
      <canvas data-family="Noto Sans SC" data-size="18" data-mode="physical" width="640" height="72" role="img" aria-label="Noto Sans SC 十八物理像素中文示例"></canvas>
    </section>
    <section class="rx400h-font-row">
      <div><strong>Noto Sans SC</strong><br><span class="text-muted">20 物理像素直接绘制</span></div>
      <canvas data-family="Noto Sans SC" data-size="20" data-mode="physical" width="640" height="72" role="img" aria-label="Noto Sans SC 二十物理像素中文示例"></canvas>
    </section>
    <section class="rx400h-font-row">
      <div><strong>Noto Sans SC</strong><br><span class="text-muted">22 物理像素直接绘制</span></div>
      <canvas data-family="Noto Sans SC" data-size="22" data-mode="physical" width="640" height="72" role="img" aria-label="Noto Sans SC 二十二物理像素中文示例"></canvas>
    </section>
  </div>
  <p id="rx400h-font-status" class="sr-only">正在绘制字体比较。</p>
</div>

<style>
  #rx400h-font-comparison {
    display: grid;
    gap: 1rem;
    color: var(--foreground);
  }
  #rx400h-font-comparison h2,
  #rx400h-font-comparison p {
    margin: 0;
  }
  #rx400h-font-comparison .rx400h-font-rows {
    display: grid;
    gap: 0.75rem;
  }
  #rx400h-font-comparison .rx400h-font-row {
    display: grid;
    grid-template-columns: minmax(10rem, 12rem) minmax(0, 40rem);
    gap: 0.75rem;
    align-items: center;
  }
  #rx400h-font-comparison canvas {
    display: block;
    width: 100%;
    max-width: 40rem;
    height: auto;
    background: #000000;
    image-rendering: pixelated;
  }
  @media (max-width: 600px) {
    #rx400h-font-comparison .rx400h-font-row {
      grid-template-columns: 1fr;
    }
  }
</style>

<script>
  (async () => {
    const root = document.getElementById('rx400h-font-comparison');
    const status = document.getElementById('rx400h-font-status');
    const firstLine = '蓝牙已连接  协议就绪  数据记录中';
    const secondLine = '最高 / 最低   冷却液   动力电池';
    const phosphor = [118, 255, 150];

    function makeBinary(source) {
      const context = source.getContext('2d');
      const image = context.getImageData(0, 0, source.width, source.height);
      for (let index = 0; index < image.data.length; index += 4) {
        const on = image.data[index + 3] >= 96;
        image.data[index] = on ? phosphor[0] : 0;
        image.data[index + 1] = on ? phosphor[1] : 0;
        image.data[index + 2] = on ? phosphor[2] : 0;
        image.data[index + 3] = 255;
      }
      context.putImageData(image, 0, 0);
    }

    function drawLogical(canvas, family, size) {
      const logical = document.createElement('canvas');
      logical.width = 320;
      logical.height = 36;
      const context = logical.getContext('2d');
      context.clearRect(0, 0, logical.width, logical.height);
      context.fillStyle = '#ffffff';
      context.textBaseline = 'top';
      context.font = `500 ${size}px "${family}", sans-serif`;
      context.fillText(firstLine, 4, 2);
      context.fillText(secondLine, 4, 4 + size + 2);
      makeBinary(logical);

      const output = canvas.getContext('2d');
      output.fillStyle = '#000000';
      output.fillRect(0, 0, canvas.width, canvas.height);
      output.imageSmoothingEnabled = false;
      output.drawImage(logical, 0, 0, canvas.width, canvas.height);
    }

    function drawPhysical(canvas, family, size) {
      const context = canvas.getContext('2d');
      context.clearRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = '#ffffff';
      context.textBaseline = 'top';
      context.font = `500 ${size}px "${family}", sans-serif`;
      context.fillText(firstLine, 8, 4);
      context.fillText(secondLine, 8, 8 + size + 2);
      makeBinary(canvas);
    }

    await Promise.all([
      document.fonts.load('500 22px "Noto Sans SC"'),
      document.fonts.load('500 22px "Microsoft YaHei UI"')
    ]);

    root.querySelectorAll('canvas').forEach((canvas) => {
      const family = canvas.dataset.family;
      const size = Number(canvas.dataset.size);
      if (canvas.dataset.mode === 'logical') drawLogical(canvas, family, size);
      else drawPhysical(canvas, family, size);
    });
    status.textContent = '字体比较已绘制。';
  })();
</script>
