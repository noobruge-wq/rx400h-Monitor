<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RX400h 0.3.5 像素界面编辑器</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI","Microsoft YaHei UI",sans-serif;
      color: #eef1f3;
      background: #111416;
    }
    * { box-sizing: border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; }
    button,input,select { font:inherit; }
    button {
      min-height:34px; padding:5px 10px; color:#eef1f3; background:#272d31;
      border:1px solid #4c555b; border-radius:4px; cursor:pointer;
    }
    button:hover { background:#333a3f; }
    button:disabled { opacity:.38; cursor:default; }
    button.primary { background:#176a3b; border-color:#42a96a; }
    button.active { color:#09140d; background:#76ff96; border-color:#b5ffc7; }
    input,select {
      width:100%; min-height:32px; padding:4px 7px; color:#f4f6f7;
      background:#1c2124; border:1px solid #485157; border-radius:3px;
    }
    input[type="checkbox"] { width:auto; min-height:0; }
    input[type="range"] { min-height:24px; padding:0; }
    #app {
      display:grid; grid-template-rows:auto minmax(0,1fr) auto;
      width:100%; height:100%; background:#111416;
    }
    .toolbar {
      display:flex; flex-wrap:wrap; align-items:center; gap:7px;
      min-height:48px; padding:7px 10px; background:#202528; border-bottom:1px solid #394147;
    }
    .tool-group {
      display:flex; align-items:center; gap:5px; padding-right:8px; border-right:1px solid #3e474d;
    }
    .tool-group:last-child { border-right:0; }
    .workbench {
      display:grid; grid-template-columns:230px minmax(0,1fr) 280px; min-height:0;
    }
    .side {
      min-height:0; overflow:auto; padding:10px; background:#1a1f22;
    }
    .left { border-right:1px solid #394147; }
    .right { border-left:1px solid #394147; }
    .side h2,.side h3 {
      margin:3px 0 8px; font-size:14px; font-weight:600;
    }
    .side h3 {
      margin-top:14px; padding-top:10px; border-top:1px solid #343c41;
    }
    .button-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
    .tool-buttons { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; }
    .field { display:grid; gap:4px; margin-bottom:8px; }
    .field label,.hint { color:#b8c0c5; font-size:12px; }
    .inline { display:flex; align-items:center; gap:7px; }
    .inline > * { min-width:0; }
    .inline label { display:flex; align-items:center; gap:5px; white-space:nowrap; }
    .layers { display:grid; gap:3px; margin-top:7px; }
    .layer {
      display:grid; grid-template-columns:28px 28px minmax(0,1fr);
      align-items:center; min-height:34px; background:#252b2f;
      border:1px solid transparent; border-radius:3px;
    }
    .layer.selected { border-color:#f2ad42; background:#353128; }
    .layer button { min-height:30px; padding:0; border:0; background:transparent; }
    .layer-name { padding:6px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; cursor:pointer; font-size:13px; }
    .unplaced {
      padding:8px; color:#76ff96; background:#06150b; border:1px dashed #3aa65c;
      text-align:center; cursor:grab; user-select:none;
    }
    .workspace {
      position:relative; min-width:0; min-height:0; overflow:auto; background:#090b0c;
    }
    .stage-wrap {
      display:flex; align-items:center; justify-content:center; min-width:100%; min-height:100%; padding:16px;
    }
    #stage {
      position:relative; flex:none; line-height:0; box-shadow:0 0 0 1px #354139;
    }
    #screen {
      display:block; width:1280px; height:720px; background:#000; image-rendering:pixelated;
      image-rendering:crisp-edges; transform-origin:top left; touch-action:none; cursor:crosshair;
    }
    #glyphCanvas {
      display:block; width:240px; height:320px; margin:8px auto; background:#000;
      image-rendering:pixelated; border:1px solid #405047; touch-action:none; cursor:crosshair;
    }
    .preview-controls { display:grid; gap:8px; }
    .range-head { display:flex; justify-content:space-between; gap:8px; color:#c7ced2; font-size:12px; }
    .tab-row { display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-bottom:10px; }
    .hidden { display:none !important; }
    .collapsed.left { display:none; }
    .collapsed.right { display:none; }
    body.left-collapsed .workbench { grid-template-columns:minmax(0,1fr) 280px; }
    body.right-collapsed .workbench { grid-template-columns:230px minmax(0,1fr); }
    body.left-collapsed.right-collapsed .workbench { grid-template-columns:minmax(0,1fr); }
    body.left-collapsed .workspace { grid-column:1; }
    body.right-collapsed .workspace { grid-column:2; }
    body.left-collapsed.right-collapsed .workspace { grid-column:1; }
    body.clean-preview .toolbar,body.clean-preview .side,body.clean-preview .status { display:none; }
    body.clean-preview #app { grid-template-rows:minmax(0,1fr); }
    body.clean-preview .workbench { grid-template-columns:minmax(0,1fr); }
    body.clean-preview .workspace { grid-column:1; }
    body.clean-preview .stage-wrap { padding:0; }
    .status {
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      min-height:28px; padding:4px 10px; color:#b8c0c5; background:#202528;
      border-top:1px solid #394147; font-size:12px;
    }
    .ok { color:#76e99a; }
    .error { color:#ff9b9b; }
    @media (max-width:1050px) {
      .workbench { grid-template-columns:190px minmax(0,1fr) 240px; }
      body.left-collapsed .workbench { grid-template-columns:minmax(0,1fr) 240px; }
      body.right-collapsed .workbench { grid-template-columns:190px minmax(0,1fr); }
      .toolbar { max-height:92px; overflow:auto; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="toolbar">
      <div class="tool-group">
        <button id="fitBtn" class="primary">完整画布</button>
        <button data-zoom="0.5">50%</button>
        <button data-zoom="1">100%</button>
        <button data-zoom="2">200%</button>
        <button id="previewBtn">干净预览</button>
      </div>
      <div class="tool-group">
        <button id="undoBtn">撤销</button>
        <button id="redoBtn">重做</button>
        <button id="leftBtn">左栏</button>
        <button id="rightBtn">右栏</button>
      </div>
      <div class="tool-group">
        <button id="importBtn">导入 JSON</button>
        <button id="exportBtn">导出 JSON</button>
        <button id="restoreBtn">恢复最近导入</button>
        <input id="importFile" type="file" accept=".json,application/json" hidden>
      </div>
    </header>

    <main class="workbench">
      <aside class="side left" id="leftPanel">
        <div class="tab-row">
          <button id="layoutTab" class="active">布局</button>
          <button id="glyphTab">字形</button>
        </div>

        <section id="layoutPane">
          <h2>像素工具</h2>
          <div class="tool-buttons">
            <button data-tool="select" class="active">选择</button>
            <button data-tool="pencil">画笔</button>
            <button data-tool="erase">橡皮</button>
            <button data-tool="line">直线</button>
            <button data-tool="rect">矩形</button>
          </div>
          <p class="hint">方向键移动 1 个逻辑像素。所有绘制都落在 640×360 网格上。</p>

          <h3>未放置元素</h3>
          <div id="unplacedSettings" class="unplaced" draggable="true">设置</div>

          <h3>参考图</h3>
          <div class="field">
            <label><input id="refTopVisible" type="checkbox" checked> 顶视图参考</label>
            <input id="refTopOpacity" type="range" min="0" max="100" value="38">
          </div>
          <div class="field">
            <label><input id="refSideVisible" type="checkbox" checked> 侧视图参考</label>
            <input id="refSideOpacity" type="range" min="0" max="100" value="38">
          </div>
          <div class="field">
            <label><input id="refBarVisible" type="checkbox" checked> 功率条参考</label>
            <input id="refBarOpacity" type="range" min="0" max="100" value="45">
          </div>

          <h3>图层（上层在前）</h3>
          <div id="layerList" class="layers"></div>
        </section>

        <section id="glyphPane" class="hidden">
          <h2>动态字形表</h2>
          <div class="field">
            <label for="glyphSet">字形尺寸</label>
            <select id="glyphSet">
              <option value="large">主数值 17px</option>
              <option value="small">次级数值 11px</option>
            </select>
          </div>
          <div class="field">
            <label for="glyphChar">字符</label>
            <select id="glyphChar"></select>
          </div>
          <div class="tool-buttons">
            <button id="glyphPencil" class="active">画笔</button>
            <button id="glyphErase">橡皮</button>
          </div>
          <canvas id="glyphCanvas" width="240" height="320" aria-label="字形像素编辑区"></canvas>
          <p class="hint">字形修改会同步影响所有使用同一尺寸的动态数值和单位。</p>
        </section>
      </aside>

      <section class="workspace" id="workspace" aria-label="640乘360逻辑画布工作区">
        <div class="stage-wrap">
          <div id="stage">
            <canvas id="screen" width="1280" height="720" aria-label="RX400h 1280乘720输出预览"></canvas>
          </div>
        </div>
      </section>

      <aside class="side right" id="rightPanel">
        <h2>所选图层</h2>
        <div id="inspector"><p class="hint">请选择图层。</p></div>

        <h3>动态预览</h3>
        <div class="preview-controls">
          <div>
            <div class="range-head"><span>SOC</span><strong id="socOut">61.5%</strong></div>
            <input id="socRange" type="range" min="0" max="100" step=".1" value="61.5">
          </div>
          <div>
            <div class="range-head"><span>车速</span><strong id="speedOut">42 km/h</strong></div>
            <input id="speedRange" type="range" min="0" max="180" step="1" value="42">
          </div>
          <div>
            <div class="range-head"><span>动力电池功率</span><strong id="powerOut">−8.4 kW</strong></div>
            <input id="powerRange" type="range" min="-50" max="50" step=".1" value="-8.4">
          </div>
          <label class="inline"><input id="idleToggle" type="checkbox"> Idle Check 激活</label>
          <button id="simulateBtn" class="primary">模拟开始</button>
        </div>

        <h3>CRT 预览</h3>
        <div class="field">
          <div class="range-head"><label for="scanOpacity">扫描线不透明度</label><strong id="scanOpacityOut">100%</strong></div>
          <input id="scanOpacity" type="range" min="0" max="100" step="1" value="100">
        </div>
        <div class="field">
          <div class="range-head"><label for="scanWidth">扫描线宽度</label><strong id="scanWidthOut">1px</strong></div>
          <input id="scanWidth" type="range" min="1" max="4" step="1" value="1">
        </div>
        <div class="field">
          <div class="range-head"><label for="scanGap">扫描线间隔</label><strong id="scanGapOut">6px</strong></div>
          <input id="scanGap" type="range" min="1" max="12" step="1" value="6">
        </div>
        <div class="field">
          <div class="range-head"><label for="glowIntensity">辉光强度</label><strong id="glowIntensityOut">50%</strong></div>
          <input id="glowIntensity" type="range" min="0" max="100" step="1" value="50">
        </div>
        <div class="field">
          <div class="range-head"><label for="glowRadius">辉光半径</label><strong id="glowRadiusOut">2px</strong></div>
          <input id="glowRadius" type="range" min="0" max="8" step="1" value="2">
        </div>
      </aside>
    </main>

    <footer class="status">
      <span id="statusText" class="ok">准备就绪</span>
      <span id="selectionText">未选择图层</span>
      <span id="zoomText">完整画布</span>
    </footer>
  </div>

        let binary = '';
        const block = 0x8000;
        for (let i = 0; i < bytes.length; i += block) {
          binary += String.fromCharCode.apply(null, bytes.subarray(i, i + block));
        }
        return btoa(binary);
      }

      function base64ToBytes(text, expected) {
        try {
          const binary = atob(text || '');
          const bytes = new Uint8Array(expected);
          const count = Math.min(binary.length, expected);
          for (let i = 0; i < count; i++) bytes[i] = binary.charCodeAt(i);
          return bytes;
        } catch (_) {
          return new Uint8Array(expected);
        }
      }

      function attachPixels(target) {
        if (!target._pixels) {
          Object.defineProperty(target, '_pixels', {
            value: base64ToBytes(target.data, target.w * target.h),
            writable: true,
            configurable: true
          });
        }
        return target._pixels;
      }

      function syncMask(target) {
        if (target._pixels) target.data = bytesToBase64(target._pixels);
      }

      function syncAllMasks() {
        project.layers.forEach(layer => {
          if (layer.kind === 'bitmap') syncMask(layer);
        });
        Object.keys(project.glyphs).forEach(setKey => {
          const set = project.glyphs[setKey];
          Object.keys(set.chars).forEach(char => syncMask(set.chars[char]));
        });
      }

      function mask(w, h) {
        const target = { w: round(w), h: round(h), data: '' };
        Object.defineProperty(target, '_pixels', {
          value: new Uint8Array(target.w * target.h),
          writable: true,
          configurable: true
        });
        return target;
      }

      function setPixel(target, x, y, value) {
        x = round(x);
        y = round(y);
        if (x < 0 || y < 0 || x >= target.w || y >= target.h) return;
        attachPixels(target)[y * target.w + x] = value ? 1 : 0;
        target._dirty = true;
      }

      function getPixel(target, x, y) {
        x = round(x);
        y = round(y);
        if (x < 0 || y < 0 || x >= target.w || y >= target.h) return 0;
        return attachPixels(target)[y * target.w + x];
      }

      function drawLine(target, x0, y0, x1, y1, value) {
        x0 = round(x0); y0 = round(y0); x1 = round(x1); y1 = round(y1);
        const dx = Math.abs(x1 - x0);
        const sx = x0 < x1 ? 1 : -1;
        const dy = -Math.abs(y1 - y0);
        const sy = y0 < y1 ? 1 : -1;
        let err = dx + dy;
        while (true) {
          setPixel(target, x0, y0, value);
          if (x0 === x1 && y0 === y1) break;
          const e2 = 2 * err;
          if (e2 >= dy) { err += dy; x0 += sx; }
          if (e2 <= dx) { err += dx; y0 += sy; }
        }
      }

      function drawRect(target, x, y, w, h, value, filled) {
        x = round(x); y = round(y); w = Math.max(1, round(w)); h = Math.max(1, round(h));
        if (filled) {
          for (let yy = y; yy < y + h; yy++) {
            for (let xx = x; xx < x + w; xx++) setPixel(target, xx, yy, value);
          }
          return;
        }
        drawLine(target, x, y, x + w - 1, y, value);
        drawLine(target, x, y + h - 1, x + w - 1, y + h - 1, value);
        drawLine(target, x, y, x, y + h - 1, value);
        drawLine(target, x + w - 1, y, x + w - 1, y + h - 1, value);
      }

      function drawPolyline(target, points, value, closed) {
        for (let i = 1; i < points.length; i++) {
          drawLine(target, points[i - 1][0], points[i - 1][1], points[i][0], points[i][1], value);
        }
        if (closed && points.length > 2) {
          drawLine(target, points[points.length - 1][0], points[points.length - 1][1], points[0][0], points[0][1], value);
        }
      }

      function drawCircle(target, cx, cy, radius, value) {
        cx = round(cx); cy = round(cy); radius = Math.max(1, round(radius));
        let x = radius;
        let y = 0;
        let err = 0;
        while (x >= y) {
          [[x,y],[y,x],[-y,x],[-x,y],[-x,-y],[-y,-x],[y,-x],[x,-y]].forEach(p => {
            setPixel(target, cx + p[0], cy + p[1], value);
          });
          y += 1;
          if (err <= 0) err += 2 * y + 1;
          if (err > 0) { x -= 1; err -= 2 * x + 1; }
        }
      }

      function rasterText(text, w, h, size, weight, align, valign) {
        const target = mask(w, h);
        const temp = document.createElement('canvas');
        temp.width = target.w;
        temp.height = target.h;
        const ctx = temp.getContext('2d');
        ctx.clearRect(0, 0, target.w, target.h);
        ctx.fillStyle = '#fff';
        const hasChinese = /[\u3400-\u9fff]/.test(String(text));
        const family = hasChinese ? '"Noto Sans SC","Microsoft YaHei UI",sans-serif' : '"Segoe UI",monospace';
        ctx.font = String(weight || 700) + ' ' + String(size) + 'px ' + family;
        ctx.textBaseline = 'middle';
        ctx.textAlign = align === 'left' ? 'left' : align === 'right' ? 'right' : 'center';
        const lines = String(text).split('\n');
        const lineHeight = Math.max(1, round(size * 1.12));
        const block = lines.length * lineHeight;
        let first = valign === 'top' ? lineHeight / 2 : valign === 'bottom' ? target.h - block + lineHeight / 2 : (target.h - block) / 2 + lineHeight / 2;
        const x = align === 'left' ? 0 : align === 'right' ? target.w : target.w / 2;
        lines.forEach((line, index) => ctx.fillText(line, x, first + index * lineHeight));
        const image = ctx.getImageData(0, 0, target.w, target.h).data;
        const bytes = attachPixels(target);
        for (let i = 0; i < bytes.length; i++) bytes[i] = image[i * 4 + 3] >= 96 ? 1 : 0;
        target._dirty = true;
        return target;
      }

      const FONT5 = {
        '0':['01110','10001','10011','10101','11001','10001','01110'],
        '1':['00100','01100','00100','00100','00100','00100','01110'],
        '2':['01110','10001','00001','00010','00100','01000','11111'],
        '3':['11110','00001','00001','01110','00001','00001','11110'],
        '4':['00010','00110','01010','10010','11111','00010','00010'],
        '5':['11111','10000','10000','11110','00001','00001','11110'],
        '6':['01110','10000','10000','11110','10001','10001','01110'],
        '7':['11111','00001','00010','00100','01000','01000','01000'],
        '8':['01110','10001','10001','01110','10001','10001','01110'],
        '9':['01110','10001','10001','01111','00001','00001','01110'],
        '.':['00000','00000','00000','00000','00000','00110','00110'],
        '-':['00000','00000','00000','11111','00000','00000','00000'],
        '−':['00000','00000','00000','11111','00000','00000','00000'],
        '—':['00000','00000','00000','11111','00000','00000','00000'],
        '/':['00001','00010','00010','00100','01000','01000','10000'],
        '%':['11001','11010','00100','01000','10110','00110','00000'],
        '°':['01100','10010','10010','01100','00000','00000','00000'],
        'V':['10001','10001','10001','10001','10001','01010','00100'],
        'C':['01111','10000','10000','10000','10000','10000','01111'],
        'k':['10000','10010','10100','11000','10100','10010','10001'],
        'W':['10001','10001','10101','10101','10101','11011','10001'],
        'r':['00000','00000','10110','11001','10000','10000','10000'],
        'p':['00000','00000','11110','10001','11110','10000','10000'],
        'm':['00000','00000','11010','10101','10101','10101','10101'],
        'h':['10000','10000','10110','11001','10001','10001','10001'],
        ' ':['00000','00000','00000','00000','00000','00000','00000']
      };

      function makeGlyph(char, scale) {
        const pattern = FONT5[char] || FONT5[' '];
        const target = mask(5 * scale, 7 * scale);
        pattern.forEach((row, y) => {
          for (let x = 0; x < row.length; x++) {
            if (row[x] === '1') drawRect(target, x * scale, y * scale, scale, scale, 1, true);
          }
        });
        return target;
      }

      function makeGlyphSet(scale) {
        const chars = {};
        Object.keys(FONT5).forEach(char => { chars[char] = makeGlyph(char, scale); });
        return {
          scale: scale,
          advance: 6 * scale,
          lineHeight: 8 * scale,
          chars: chars
        };
      }

      function bitmapLayer(id, name, x, y, w, h, z, alpha, role, builder) {
        const layer = {
          id: id, name: name, kind: 'bitmap', x: round(x), y: round(y), w: round(w), h: round(h),
          z: z, alpha: alpha, visible: true, locked: false, role: role || 'static', data: ''
        };
        Object.defineProperty(layer, '_pixels', {
          value: new Uint8Array(layer.w * layer.h),
          writable: true,
          configurable: true
        });
        if (builder) builder(layer);
        layer._dirty = true;
        syncMask(layer);
        return layer;
      }

      function textLayer(id, name, text, x, y, w, h, size, weight, align, alpha, z, role) {
        const target = rasterText(text, w, h, size, weight, align, 'center');
        return {
          id: id, name: name, kind: 'bitmap', x: round(x), y: round(y), w: target.w, h: target.h,
          z: z, alpha: alpha, visible: true, locked: false, role: role || 'static',
          data: target.data, _pixels: target._pixels
        };
      }

      function physicalTextLayer(id, name, text, x, y, w, h, sizePx, weight, align, alpha, z, lineHeightPx) {
        const layer = bitmapLayer(id,name,x,y,w,h,z,alpha,'physical-text');
        layer.physicalText = {

          weight: round(weight || 500), align: align || 'center', valign: 'center',

      function serializable(value) {
        syncAllMasks();
        return JSON.stringify(value, (key, item) => key.startsWith('_') ? undefined : item);
      }

      function cloneProject(value) {
        return JSON.parse(serializable(value));
      }

      function status(message, isError) {
        statusText.textContent = message;
        statusText.className = isError ? 'error' : 'ok';
      }

      function saveLocal() {
        try {
          localStorage.setItem(STORAGE_KEY, serializable(project));
          status('已自动保存在本机', false);
        } catch (error) {
          status('本机自动保存失败：' + error.message, true);
        }
      }

      function snapshot() {
        return serializable(project);
      }

      function pushHistory() {
        const snap = snapshot();
        if (historyIndex >= 0 && history[historyIndex] === snap) return;
        history = history.slice(0, historyIndex + 1);
        history.push(snap);
        if (history.length > 30) history.shift();
        historyIndex = history.length - 1;
        saveLocal();
        updateUndoButtons();
      }

      function restoreHistory(index) {
        if (index < 0 || index >= history.length) return;
        historyIndex = index;
        project = JSON.parse(history[index]);
        attachProject(project);
        selectedId = project.layers.some(layer => layer.id === selectedId) ? selectedId : null;
        bindProjectControls();
        rebuildLayerList();
        rebuildInspector();
        renderGlyphEditor();
        render();
        updateUndoButtons();
        saveLocal();
      }

      function updateUndoButtons() {
        $('undoBtn').disabled = historyIndex <= 0;
        $('redoBtn').disabled = historyIndex >= history.length - 1;
      }

      function attachProject(value) {
        value.layers.forEach(layer => {
          if (layer.kind === 'bitmap') attachPixels(layer);
        });
        Object.keys(value.glyphs).forEach(setKey => {
          Object.keys(value.glyphs[setKey].chars).forEach(char => attachPixels(value.glyphs[setKey].chars[char]));
        });
      }

      function selectedLayer() {
        return project.layers.find(layer => layer.id === selectedId) || null;
      }

      function ensureMaskCanvas(target) {
        if (!target._canvas) {
          Object.defineProperty(target, '_canvas', {
            value: document.createElement('canvas'),
            writable: true,
            configurable: true
          });
          target._canvas.width = target.w;
          target._canvas.height = target.h;
          target._dirty = true;
        }
        if (target._canvas.width !== target.w || target._canvas.height !== target.h) {
          target._canvas.width = target.w;
          target._canvas.height = target.h;
          target._dirty = true;
        }
        if (target._dirty || target._color !== project.palette.phosphor) {
          const ctx = target._canvas.getContext('2d');
          const image = ctx.createImageData(target.w, target.h);
          const bytes = attachPixels(target);
          const rgb = hexRgb(project.palette.phosphor);
          for (let i = 0; i < bytes.length; i++) {
            if (!bytes[i]) continue;
            const offset = i * 4;
            image.data[offset] = rgb[0];
            image.data[offset + 1] = rgb[1];
            image.data[offset + 2] = rgb[2];
            image.data[offset + 3] = 255;
          }
          ctx.clearRect(0, 0, target.w, target.h);
          ctx.putImageData(image, 0, 0);
          target._dirty = false;
          target._color = project.palette.phosphor;
        }
        return target._canvas;
      }

      function hexRgb(hex) {
        const value = String(hex).replace('#','');
        return [
          parseInt(value.slice(0,2),16) || 0,
          parseInt(value.slice(2,4),16) || 0,
          parseInt(value.slice(4,6),16) || 0
        ];
      }

      function ensurePhysicalTextCanvas(layer) {
        const config = layer.physicalText;
        const width = layer.w * 2;
        const height = layer.h * 2;
        const cacheKey = JSON.stringify([width,height,config,project.palette.phosphor]);
        if (!layer._physicalCanvas) {
          Object.defineProperty(layer,'_physicalCanvas',{
            value:document.createElement('canvas'),writable:true,configurable:true
          });
        }
        if (layer._physicalKey === cacheKey) return layer._physicalCanvas;
        const canvas = layer._physicalCanvas;
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0,0,width,height);
        ctx.fillStyle = '#fff';
        ctx.textBaseline = 'middle';
        ctx.textAlign = config.align === 'left' ? 'left' : config.align === 'right' ? 'right' : 'center';
        ctx.font = String(config.weight || 500) + ' ' + String(config.sizePx) + 'px "Noto Sans SC","Microsoft YaHei UI",sans-serif';
        const lines = String(config.text).split('\n');
        const lineHeight = Math.max(1,round(config.lineHeightPx || config.sizePx * 1.12));
        const block = lines.length * lineHeight;
        const first = config.valign === 'top' ? lineHeight / 2 :
          config.valign === 'bottom' ? height - block + lineHeight / 2 :
          (height - block) / 2 + lineHeight / 2;
        const x = config.align === 'left' ? 0 : config.align === 'right' ? width : width / 2;
        lines.forEach((line,index) => ctx.fillText(line,x,first + index * lineHeight));
        const image = ctx.getImageData(0,0,width,height);
        const rgb = hexRgb(project.palette.phosphor);
        const threshold = Number(config.threshold) || 96;
        for (let index=0;index<image.data.length;index+=4) {
          if (image.data[index+3] >= threshold) {
            image.data[index]=rgb[0]; image.data[index+1]=rgb[1]; image.data[index+2]=rgb[2]; image.data[index+3]=255;
          } else {
            image.data[index]=0; image.data[index+1]=0; image.data[index+2]=0; image.data[index+3]=0;
          }
        }
        ctx.clearRect(0,0,width,height);
        ctx.putImageData(image,0,0);
        layer._physicalKey = cacheKey;
        return canvas;
      }

      function drawPhysicalTextLayers(ctx) {
        project.layers.slice().sort((a,b) => a.z - b.z).forEach(layer => {
          if (!layer.visible || !layer.physicalText) return;
          ctx.save();
          ctx.globalAlpha = layer.alpha;
          ctx.drawImage(ensurePhysicalTextCanvas(layer),layer.x * 2,layer.y * 2);
          ctx.restore();
        });
      }

      function socVisualFraction(soc) {
        const value = clamp(Number(soc) || 0, 0, 100);
        if (value <= 30) return value / 30 * .15;
        if (value <= 80) return .15 + (value - 30) / 50 * .75;
        return .9 + (value - 80) / 20 * .1;
      }

      function formatSigned(value, unit) {
        const number = Number(value);
        const sign = number < 0 ? '−' : ' ';
        return sign + Math.abs(number).toFixed(1) + ' ' + unit;
      }

      function slotText(layer) {
        switch (layer.binding) {
          case 'soc': return Number(project.preview.soc).toFixed(1) + ' %';
          case 'speed': return String(Math.round(Number(project.preview.speed))) + ' km/h';
          case 'hvPower': return formatSigned(project.preview.hvPower, 'kW');
          default: return layer.sample;
        }
      }

      function drawGlyphText(ctx, layer, text) {
        const set = project.glyphs[layer.glyphSet];
        const scale = set.scale;
        const total = Math.max(0, text.length * set.advance - scale);
        let x = layer.align === 'center' ? layer.x + Math.floor((layer.w - total) / 2) :
          layer.align === 'left' ? layer.x : layer.x + layer.w - total;
        const y = layer.y + Math.floor((layer.h - set.lineHeight + scale) / 2);
        ctx.save();
        ctx.globalAlpha = layer.alpha;
        for (const char of text) {
          const glyph = set.chars[char] || set.chars[' '];
          const glyphCanvas = ensureMaskCanvas(glyph);
          ctx.drawImage(glyphCanvas, x, y);
          x += set.advance;
        }
        ctx.restore();
      }

      function drawSpokes(ctx, layer) {
        const centers = [[39,77],[145,77]];
        const pixels = attachPixels(layer);
        const cos = Math.cos(wheelAngle);
        const sin = Math.sin(wheelAngle);
        ctx.save();
        ctx.globalAlpha = layer.alpha;
        ctx.fillStyle = project.palette.phosphor;
        for (let y=0;y<layer.h;y++) {
          for (let x=0;x<layer.w;x++) {
            if (!pixels[y*layer.w+x]) continue;
            const center = Math.abs(x-centers[0][0]) <= Math.abs(x-centers[1][0]) ? centers[0] : centers[1];
            const dx=x-center[0], dy=y-center[1];
            const rx=round(center[0]+dx*cos-dy*sin);
            const ry=round(center[1]+dx*sin+dy*cos);
            ctx.fillRect(layer.x+rx,layer.y+ry,1,1);
          }
        }
        ctx.restore();
      }

      function currentPowerSegments(now) {
        if (!startup) {
          const value = clamp(displayedPower, -50, 50);
          return { left: value < 0 ? value : 0, right: value > 0 ? value : 0 };
        }
        const elapsed = now - startup.startedAt;
        if (elapsed <= 600) {
          const f = clamp(elapsed / 600, 0, 1);
          return { left: -50 * f, right: 50 * f };
        }
        const f = clamp((elapsed - 600) / 400, 0, 1);
        const goal = Number(startup.powerGoal);
        if (goal < 0) return { left: -50 + (goal + 50) * f, right: 50 * (1 - f) };
        if (goal > 0) return { left: -50 * (1 - f), right: 50 + (goal - 50) * f };
        return { left: -50 * (1 - f), right: 50 * (1 - f) };
      }

      function drawPowerFill(ctx, layer, now) {
        const segments = currentPowerSegments(now);
        const zero = 100;
        const leftEnd = round(zero + segments.left / 50 * 92);
        const rightEnd = round(zero + segments.right / 50 * 92);
        const source = ensureMaskCanvas(layer);
        ctx.save();
        ctx.globalAlpha = layer.alpha;
        if (leftEnd < zero) {
          ctx.drawImage(source, leftEnd, 0, zero - leftEnd + 1, layer.h, layer.x + leftEnd, layer.y, zero - leftEnd + 1, layer.h);
        }
        if (rightEnd > zero) {
          ctx.drawImage(source, zero, 0, rightEnd - zero + 1, layer.h, layer.x + zero, layer.y, rightEnd - zero + 1, layer.h);
        }
        ctx.restore();
      }

      function drawPowerCursor(ctx, layer, now) {
        const segments = currentPowerSegments(now);
        const endpoints = [];
        if (segments.left < -.01) endpoints.push(round(530 + segments.left / 50 * 92));
        if (segments.right > .01) endpoints.push(round(530 + segments.right / 50 * 92));
        if (!endpoints.length) endpoints.push(530);
        const source = ensureMaskCanvas(layer);
        ctx.save();
        ctx.globalAlpha = layer.alpha;
        endpoints.forEach(x => ctx.drawImage(source, x - Math.floor(layer.w / 2), layer.y));
        ctx.restore();
      }

      function drawLayer(ctx, layer, now) {
        if (!layer.visible) return;
        if (layer.kind === 'slot') {
          drawGlyphText(ctx, layer, slotText(layer));
          return;
        }
        const source = ensureMaskCanvas(layer);
        if (layer.role === 'soc-fill') {
          const fraction = socVisualFraction(displayedSoc);
          const visibleH = Math.max(0, Math.min(layer.h, round(layer.h * fraction)));
          if (!visibleH) return;
          ctx.save();
          ctx.globalAlpha = layer.alpha;
          ctx.drawImage(source,0,layer.h-visibleH,layer.w,visibleH,layer.x,layer.y+layer.h-visibleH,layer.w,visibleH);
          ctx.restore();
          return;
        }
        if (layer.role === 'wheel-spokes') {
          drawSpokes(ctx, layer);
          return;
        }
        if (layer.role === 'power-fill') {
          drawPowerFill(ctx, layer, now);
          return;
        }
        if (layer.role === 'power-cursor') {
          drawPowerCursor(ctx, layer, now);
          return;
        }
        ctx.save();
        ctx.globalAlpha = layer.role === 'idle' ? (project.preview.idle ? 1 : .1) : layer.alpha;
        ctx.drawImage(source, layer.x, layer.y);
        ctx.restore();
      }

      function drawReferences(ctx) {
        if (document.body.classList.contains('clean-preview')) return;
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        Object.keys(REFS).forEach(key => {
          const config = project.references[key];
          const image = referenceImages[key];
          if (!config.visible || !image.complete || !image.naturalWidth) return;
          ctx.globalAlpha = config.opacity / 100;
          const r = REFS[key];
          ctx.drawImage(image,r.x,r.y,r.w,r.h);
        });
        ctx.restore();
      }

      function render(now) {
        now = Number(now) || performance.now();
        lctx.globalCompositeOperation = 'source-over';
        lctx.globalAlpha = 1;
        lctx.fillStyle = project.palette.background;
        lctx.fillRect(0,0,LW,LH);
        drawReferences(lctx);
        project.layers.slice().sort((a,b) => a.z - b.z).forEach(layer => drawLayer(lctx,layer,now));

        out.imageSmoothingEnabled = false;
        out.fillStyle = '#000';
        out.fillRect(0,0,OW,OH);

        sharpCtx.globalCompositeOperation = 'source-over';
        sharpCtx.globalAlpha = 1;
        sharpCtx.fillStyle = '#000';
        sharpCtx.fillRect(0,0,OW,OH);
        sharpCtx.imageSmoothingEnabled = false;
        sharpCtx.drawImage(logical,0,0,OW,OH);
        drawPhysicalTextLayers(sharpCtx);

        const effect = project.effects;
        if (effect.glowIntensity > 0 && effect.glowRadiusPx > 0) {
          glowCtx.clearRect(0,0,OW,OH);
          glowCtx.imageSmoothingEnabled = false;
          glowCtx.drawImage(sharpCanvas,0,0);
          out.save();
          out.globalAlpha = effect.glowIntensity / 100 * .7;
          out.filter = 'blur(' + String(effect.glowRadiusPx) + 'px)';
          out.drawImage(glowCanvas,0,0);
          out.restore();
          out.filter = 'none';
        }
        out.globalAlpha = 1;
        out.imageSmoothingEnabled = false;
        out.drawImage(sharpCanvas,0,0);

        if (effect.scanlineOpacity > 0) {
          out.save();
          out.fillStyle = 'rgba(0,0,0,' + String(effect.scanlineOpacity / 100) + ')';
          const pitch = effect.scanlineWidthPx + effect.scanlineGapPx;
          for (let y = effect.scanlineGapPx; y < OH; y += pitch) {
            out.fillRect(0,y,OW,effect.scanlineWidthPx);
          }
          out.restore();
        }

        if (!document.body.classList.contains('clean-preview')) drawSelectionOverlay();
        renderQueued = false;
      }

      function drawSelectionOverlay() {
        const layer = selectedLayer();
        if (!layer) return;
        out.save();
        out.strokeStyle = '#ffae32';
        out.lineWidth = 2;
        out.setLineDash([6,4]);
        out.strokeRect(layer.x * 2 + 1,layer.y * 2 + 1,Math.max(1,layer.w * 2 - 2),Math.max(1,layer.h * 2 - 2));
        out.restore();
      }

      function requestRender() {
        if (renderQueued) return;
        renderQueued = true;
        requestAnimationFrame(render);
      }

      function transition(name, target, duration) {
        const current = name === 'soc' ? displayedSoc : name === 'power' ? displayedPower : wheelVisualSpeed;
        transitions[name] = { from:current, to:target, start:performance.now(), duration:duration };
        animationLoop();
      }

      function updateTransitions(now) {
        let active = false;
        Object.keys(transitions).forEach(name => {
          const tr = transitions[name];
          if (!tr) return;
          const p = clamp((now - tr.start) / tr.duration,0,1);
          const eased = p * p * (3 - 2 * p);
          const value = tr.from + (tr.to - tr.from) * eased;
          if (name === 'soc') displayedSoc = value;
          if (name === 'power') displayedPower = value;
          if (name === 'wheel') wheelVisualSpeed = value;
          if (p >= 1) transitions[name] = null;
          else active = true;
        });
        return active;
      }

      function animationLoop() {
        if (animationLoop.running) return;
        animationLoop.running = true;
        const tick = now => {
          let active = updateTransitions(now);
          if (startup) {
            const elapsed = now - startup.startedAt;
            if (elapsed <= 600) displayedSoc = 100 * clamp(elapsed / 600,0,1);
            else displayedSoc = 100 + (startup.socGoal - 100) * clamp((elapsed - 600) / 400,0,1);
            if (elapsed >= 1000) {
              displayedSoc = startup.socGoal;
              displayedPower = startup.powerGoal;
              startup = null;
              // Draw one final frame after collapsing the two self-test
              // cursors.  Without this, a stopped vehicle can retain the
              // previous frame's inactive-side cursor/fill until some other
              // UI event happens to trigger a repaint.
              active = true;
            } else active = true;
          }
          const wheelMoving = wheelVisualSpeed > .001;
          if (wheelMoving && now - lastFrameMs >= 100) {
            const dt = lastFrameMs ? (now - lastFrameMs) / 1000 : .1;
            wheelAngle = (wheelAngle + wheelVisualSpeed * Math.PI * 2 * dt) % (Math.PI * 2);
            lastFrameMs = now;
            render(now);
          } else if (active) {
            render(now);
          }
          if (active || wheelMoving || transitions.wheel) requestAnimationFrame(tick);
          else animationLoop.running = false;
        };
        requestAnimationFrame(tick);
      }

      function setZoom(value, label) {
        zoom = value;
        const width = Math.round(OW * value);
        const height = Math.round(OH * value);
        screen.style.width = String(width) + 'px';
        screen.style.height = String(height) + 'px';
        stage.style.width = String(width) + 'px';
        stage.style.height = String(height) + 'px';
        zoomText.textContent = label || Math.round(value * 100) + '%';
      }

      function fitCanvas() {
        const maxW = Math.max(1,workspace.clientWidth - 32);
        const maxH = Math.max(1,workspace.clientHeight - 32);
        const choices = [2,1,.5,.25];
        const choice = choices.find(value => OW * value <= maxW && OH * value <= maxH) || .25;
        setZoom(choice,'完整画布 ' + Math.round(choice * 100) + '%');
        workspace.scrollLeft = 0;
        workspace.scrollTop = 0;
      }

      function screenPoint(event) {
        const rect = screen.getBoundingClientRect();
        return {
          x: clamp(Math.floor((event.clientX - rect.left) / rect.width * LW),0,LW-1),
          y: clamp(Math.floor((event.clientY - rect.top) / rect.height * LH),0,LH-1)
        };
      }

      function topLayerAt(point) {
        return project.layers.slice().sort((a,b) => b.z - a.z).find(layer =>
          layer.visible && !layer.locked && point.x >= layer.x && point.y >= layer.y &&
          point.x < layer.x + layer.w && point.y < layer.y + layer.h
        ) || null;
      }

      function resizeBitmapLayer(layer, width, height) {
        width = Math.max(1,round(width));
        height = Math.max(1,round(height));
        if (layer.kind !== 'bitmap') {
          layer.w = width; layer.h = height; return;
        }
        const old = attachPixels(layer);
        const next = new Uint8Array(width * height);
        const copyW = Math.min(width,layer.w);
        const copyH = Math.min(height,layer.h);
        for (let y = 0; y < copyH; y++) {
          next.set(old.subarray(y * layer.w,y * layer.w + copyW),y * width);
        }
        layer.w = width; layer.h = height; layer._pixels = next; layer._canvas = null; layer._dirty = true;
      }

      function rebuildLayerList() {
        layerList.replaceChildren();
        project.layers.slice().sort((a,b) => b.z - a.z).forEach(layer => {
          const row = document.createElement('div');
          row.className = 'layer' + (layer.id === selectedId ? ' selected' : '');
          const visible = document.createElement('button');
          visible.textContent = layer.visible ? '◉' : '○';
          visible.setAttribute('aria-label',layer.visible ? '隐藏图层' : '显示图层');
          visible.addEventListener('click',event => {
            event.stopPropagation();
            layer.visible = !layer.visible;
            pushHistory(); rebuildLayerList(); render();
          });
          const locked = document.createElement('button');
          locked.textContent = layer.locked ? '锁' : '开';
          locked.setAttribute('aria-label',layer.locked ? '解锁图层' : '锁定图层');
          locked.addEventListener('click',event => {
            event.stopPropagation();
            layer.locked = !layer.locked;
            pushHistory(); rebuildLayerList(); rebuildInspector(); render();
          });
          const name = document.createElement('div');
          name.className = 'layer-name';
          name.textContent = layer.name;
          name.addEventListener('click',() => {
            selectedId = layer.id;
            rebuildLayerList(); rebuildInspector(); render();
          });
          row.append(visible,locked,name);
          layerList.appendChild(row);
        });
        $('unplacedSettings').classList.toggle('hidden',project.unplaced.length === 0);
      }

      function inspectorField(labelText,key,value,type,min,max) {
        const wrapper = document.createElement('div');
        wrapper.className = 'field';
        const label = document.createElement('label');
        label.textContent = labelText;
        const input = document.createElement('input');
        input.type = type || 'number';
        input.value = value;
        input.dataset.key = key;
        if (min !== undefined) input.min = min;
        if (max !== undefined) input.max = max;
        wrapper.append(label,input);
        return wrapper;
      }

      function rebuildInspector() {
        inspector.replaceChildren();
        const layer = selectedLayer();
        if (!layer) {
          const p = document.createElement('p');
          p.className = 'hint';
          p.textContent = '请选择图层。';
          inspector.appendChild(p);
          selectionText.textContent = '未选择图层';
          return;
        }
        selectionText.textContent = layer.name + '  x=' + layer.x + ' y=' + layer.y;
        inspector.append(
          inspectorField('名称','name',layer.name,'text'),
          inspectorField('X（逻辑像素）','x',layer.x,'number',-640,640),
          inspectorField('Y（逻辑像素）','y',layer.y,'number',-360,360),
          inspectorField('宽度（改边界，不缩放像素）','w',layer.w,'number',1,640),
          inspectorField('高度（改边界，不缩放像素）','h',layer.h,'number',1,360),
          inspectorField('主体亮度 0–100','alpha',Math.round(layer.alpha * 100),'number',0,100)
        );
        const role = document.createElement('p');
        role.className = 'hint';
        role.textContent = '类型：' + layer.kind + ' / ' + layer.role;
        inspector.appendChild(role);
        const order = document.createElement('div');
        order.className = 'button-grid';
        const up = document.createElement('button');
        up.textContent = '上移一层';
        const down = document.createElement('button');
        down.textContent = '下移一层';
        up.addEventListener('click',() => changeLayerOrder(layer,1));
        down.addEventListener('click',() => changeLayerOrder(layer,-1));
        order.append(up,down);
        inspector.appendChild(order);

        inspector.querySelectorAll('input').forEach(input => {
          input.addEventListener('change',() => {
            const current = selectedLayer();
            if (!current) return;
            const key = input.dataset.key;
            if (key === 'name') current.name = input.value.trim() || current.name;
            if (key === 'x') current.x = round(input.value);
            if (key === 'y') current.y = round(input.value);
            if (key === 'alpha') current.alpha = clamp(Number(input.value) / 100,0,1);
            if (key === 'w') resizeBitmapLayer(current,input.value,current.h);
            if (key === 'h') resizeBitmapLayer(current,current.w,input.value);
            pushHistory(); rebuildLayerList(); rebuildInspector(); render();
          });
        });
      }

      function changeLayerOrder(layer,direction) {
        const ordered = project.layers.slice().sort((a,b) => a.z - b.z);
        const index = ordered.findIndex(item => item.id === layer.id);
        const otherIndex = clamp(index + direction,0,ordered.length - 1);
        if (index === otherIndex) return;
        const other = ordered[otherIndex];
        const z = layer.z; layer.z = other.z; other.z = z;
        pushHistory(); rebuildLayerList(); render();
      }

      function chooseTool(next) {
        tool = next;
        document.querySelectorAll('[data-tool]').forEach(button => button.classList.toggle('active',button.dataset.tool === tool));
        screen.style.cursor = tool === 'select' ? 'default' : 'crosshair';
      }

      function paintAt(layer,point,value) {
        setPixel(layer,point.x-layer.x,point.y-layer.y,value);
      }

      function beginCanvasPointer(event) {
        if (document.body.classList.contains('clean-preview')) return;
        const point = screenPoint(event);
        if (tool === 'select') {
          const hit = topLayerAt(point);
          selectedId = hit ? hit.id : null;
          rebuildLayerList(); rebuildInspector(); render();
          if (hit) {
            pointer = { mode:'move',start:point,x:hit.x,y:hit.y,changed:false };
            screen.setPointerCapture(event.pointerId);
          }
          return;
        }
        const layer = selectedLayer();
        if (!layer || layer.kind !== 'bitmap' || layer.locked) {
          status('请先选择一个未锁定的像素图层',true);
          return;
        }
        pointer = {
          mode:tool,start:point,last:point,changed:true,
          baseline:new Uint8Array(attachPixels(layer))
        };
        screen.setPointerCapture(event.pointerId);
        if (tool === 'pencil') paintAt(layer,point,1);
        if (tool === 'erase') paintAt(layer,point,0);
        requestRender();
      }

      function moveCanvasPointer(event) {
        if (!pointer) return;
        const point = screenPoint(event);
        const layer = selectedLayer();
        if (!layer) return;
        if (pointer.mode === 'move') {
          layer.x = pointer.x + point.x - pointer.start.x;
          layer.y = pointer.y + point.y - pointer.start.y;
          pointer.changed = layer.x !== pointer.x || layer.y !== pointer.y;
          rebuildInspector(); requestRender();
          return;
        }
        if (pointer.mode === 'pencil' || pointer.mode === 'erase') {
          drawLine(layer,pointer.last.x-layer.x,pointer.last.y-layer.y,point.x-layer.x,point.y-layer.y,pointer.mode === 'pencil' ? 1 : 0);
          pointer.last = point;
          requestRender();
          return;
        }
        layer._pixels = new Uint8Array(pointer.baseline);
        layer._dirty = true;
        if (pointer.mode === 'line') {
          drawLine(layer,pointer.start.x-layer.x,pointer.start.y-layer.y,point.x-layer.x,point.y-layer.y,1);
        }
        if (pointer.mode === 'rect') {
          const x = Math.min(pointer.start.x,point.x)-layer.x;
          const y = Math.min(pointer.start.y,point.y)-layer.y;
          const w = Math.abs(point.x-pointer.start.x)+1;
          const h = Math.abs(point.y-pointer.start.y)+1;
          drawRect(layer,x,y,w,h,1,false);
        }
        requestRender();
      }

      function endCanvasPointer(event) {
        if (!pointer) return;
        if (screen.hasPointerCapture(event.pointerId)) screen.releasePointerCapture(event.pointerId);
        const changed = pointer.changed;
        pointer = null;
        if (changed) {
          pushHistory(); rebuildLayerList(); rebuildInspector(); render();
        }
      }

      function placeSettings(event) {
        event.preventDefault();
        if (!project.unplaced.length) return;
        const point = screenPoint(event);
        const w = 83, h = 31;
        const x = clamp(point.x - Math.floor(w/2),0,LW-w);
        const y = clamp(point.y - Math.floor(h/2),0,LH-h);
        const z = Math.max.apply(null,project.layers.map(layer => layer.z).concat([0])) + 1;
        const layer = buttonLayer('settings-button','设置按钮','设置',x,y,z,700);
        layer.role = 'settings-button';
        project.layers.push(layer);
        project.unplaced = [];
        selectedId = layer.id;
        pushHistory(); rebuildLayerList(); rebuildInspector(); render();
      }

      function glyphSelection() {
        const setKey = $('glyphSet').value;
        const char = $('glyphChar').value;
        return { setKey:setKey,char:char,glyph:project.glyphs[setKey].chars[char] };
      }

      function populateGlyphChars() {
        const previous = $('glyphChar').value;
        $('glyphChar').replaceChildren();
        Object.keys(project.glyphs[$('glyphSet').value].chars).forEach(char => {
          const option = document.createElement('option');
          option.value = char;
          option.textContent = char === ' ' ? '空格' : char;
          $('glyphChar').appendChild(option);
        });
        if ([...$('glyphChar').options].some(option => option.value === previous)) $('glyphChar').value = previous;
      }

      function glyphGeometry() {
        const chosen = glyphSelection();
        const cell = Math.max(1,Math.floor(Math.min(glyphCanvas.width/chosen.glyph.w,glyphCanvas.height/chosen.glyph.h)));
        return {
          chosen:chosen, cell:cell,
          ox:Math.floor((glyphCanvas.width-chosen.glyph.w*cell)/2),
          oy:Math.floor((glyphCanvas.height-chosen.glyph.h*cell)/2)
        };
      }

      function renderGlyphEditor() {
        if (!project) return;
        const g = glyphGeometry();
        glyphCtx.fillStyle = '#000';
        glyphCtx.fillRect(0,0,glyphCanvas.width,glyphCanvas.height);
        glyphCtx.fillStyle = project.palette.phosphor;
        const bytes = attachPixels(g.chosen.glyph);
        for (let y=0;y<g.chosen.glyph.h;y++) {
          for (let x=0;x<g.chosen.glyph.w;x++) {
            if (bytes[y*g.chosen.glyph.w+x]) {
              glyphCtx.fillRect(g.ox+x*g.cell,g.oy+y*g.cell,g.cell,g.cell);
            }
          }
        }
        glyphCtx.strokeStyle = 'rgba(118,255,150,.22)';
        glyphCtx.lineWidth = 1;
        for (let x=0;x<=g.chosen.glyph.w;x++) {
          glyphCtx.beginPath(); glyphCtx.moveTo(g.ox+x*g.cell+.5,g.oy); glyphCtx.lineTo(g.ox+x*g.cell+.5,g.oy+g.chosen.glyph.h*g.cell); glyphCtx.stroke();
        }
        for (let y=0;y<=g.chosen.glyph.h;y++) {
          glyphCtx.beginPath(); glyphCtx.moveTo(g.ox,g.oy+y*g.cell+.5); glyphCtx.lineTo(g.ox+g.chosen.glyph.w*g.cell,g.oy+y*g.cell+.5); glyphCtx.stroke();
        }
      }

      function glyphPoint(event) {
        const g = glyphGeometry();
        const rect = glyphCanvas.getBoundingClientRect();
        const px = (event.clientX-rect.left)/rect.width*glyphCanvas.width;
        const py = (event.clientY-rect.top)/rect.height*glyphCanvas.height;
        return {
          chosen:g.chosen,
          x:Math.floor((px-g.ox)/g.cell),
          y:Math.floor((py-g.oy)/g.cell)
        };
      }

      function paintGlyph(event) {
        const point = glyphPoint(event);
        setPixel(point.chosen.glyph,point.x,point.y,glyphTool === 'pencil' ? 1 : 0);
        renderGlyphEditor(); render();
      }

      function bindProjectControls() {
        $('refTopVisible').checked = project.references.top.visible;
        $('refTopOpacity').value = project.references.top.opacity;
        $('refSideVisible').checked = project.references.side.visible;
        $('refSideOpacity').value = project.references.side.opacity;
        $('refBarVisible').checked = project.references.bar.visible;
        $('refBarOpacity').value = project.references.bar.opacity;
        $('socRange').value = project.preview.soc;
        $('speedRange').value = project.preview.speed;
        $('powerRange').value = project.preview.hvPower;
        $('idleToggle').checked = project.preview.idle;
        $('scanOpacity').value = project.effects.scanlineOpacity;
        $('scanWidth').value = project.effects.scanlineWidthPx;
        $('scanGap').value = project.effects.scanlineGapPx;
        $('glowIntensity').value = project.effects.glowIntensity;
        $('glowRadius').value = project.effects.glowRadiusPx;
        updateOutputs();
      }

      function updateOutputs() {
        $('socOut').textContent = Number(project.preview.soc).toFixed(1) + '%';
        $('speedOut').textContent = String(Math.round(project.preview.speed)) + ' km/h';
        $('powerOut').textContent = formatSigned(project.preview.hvPower,'kW').trim();
        $('scanOpacityOut').textContent = String(project.effects.scanlineOpacity) + '%';
        $('scanWidthOut').textContent = String(project.effects.scanlineWidthPx) + 'px';
        $('scanGapOut').textContent = String(project.effects.scanlineGapPx) + 'px';
        $('glowIntensityOut').textContent = String(project.effects.glowIntensity) + '%';
        $('glowRadiusOut').textContent = String(project.effects.glowRadiusPx) + 'px';
      }

      function normalizeV2(value) {
        if (!value || value.version !== 2 || !value.canvas || value.canvas.width !== LW || value.canvas.height !== LH) {
          throw new Error('不是 640×360 的 V2 像素布局');
        }
        if (!Array.isArray(value.layers) || value.layers.length > 200) throw new Error('图层数据无效');
        if (!value.glyphs || !value.glyphs.large || !value.glyphs.small) throw new Error('缺少动态字形表');
        value.layers.forEach(layer => {
          ['x','y','w','h','z','alpha'].forEach(key => {
            if (!Number.isFinite(Number(layer[key]))) throw new Error('图层数值无效：' + layer.id);
          });
          if (layer.kind === 'bitmap' && typeof layer.data !== 'string') throw new Error('像素图层无效：' + layer.id);
        });
        value.palette = { background:'#000000',phosphor:PHOSPHOR };
        value.preview = value.preview || { soc:61.5,speed:42,hvPower:-8.4,idle:false };
        value.references = value.references || {
          top:{visible:true,opacity:38},side:{visible:true,opacity:38},bar:{visible:true,opacity:45}
        };
        value.unplaced = Array.isArray(value.unplaced) ? value.unplaced : [];
        return value;
      }

      function migrateV1(value) {
        if (!value || value.version !== 1 || !value.canvas || value.canvas.width !== 1280 || value.canvas.height !== 720 || !Array.isArray(value.items)) {
          throw new Error('无法识别的布局格式');
        }
        const next = createDefaultProject();
        const aliases = {
          'text-1788019715116-6':'idle-label',
          'rect-1788019782381-7':'idle-frame',
          'rect-1788018726061-3':'vehicle-lower-line',
          'rect-1788018803379-4':'vehicle-mid-line'
        };
        value.items.forEach(item => {
          if (item.type === 'image' || item.id === 'idle-check') return;
          const id = aliases[item.id] || item.id;
          const layer = next.layers.find(entry => entry.id === id);
          if (!layer) return;
          layer.x = round(item.x / 2);
          layer.y = round(item.y / 2);
          const w = Math.max(1,round(item.w / 2));
          const h = Math.max(1,round(item.h / 2));
          resizeBitmapLayer(layer,w,h);
        });
        return next;
      }

      function importJson(file) {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const raw = JSON.parse(reader.result);
            const next = raw.version === 1 ? migrateV1(raw) : normalizeV2(raw);
            project = next;
            attachProject(project);
            selectedId = null;
            importBaseline = cloneProject(project);
            localStorage.setItem(IMPORT_KEY,serializable(importBaseline));
            history = []; historyIndex = -1; pushHistory();
            bindProjectControls(); populateGlyphChars(); rebuildLayerList(); rebuildInspector(); renderGlyphEditor(); render();
            status(raw.version === 1 ? '旧版布局已转换为 640×360 像素布局' : '导入成功',false);
          } catch (error) {
            status('导入失败：' + error.message,true);
          } finally {
            $('importFile').value = '';
          }
        };
        reader.readAsText(file,'utf-8');
      }

      function exportJson() {
        const payload = cloneProject(project);
        delete payload.preview;
        payload.editorContract = {
          coordinates:'640x360 logical pixels',
          output:'nearest-neighbor 2x to 1280x720',
          referencesEmbedded:false,
          runtimeParsesOnce:true
        };
        const blob = new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'RX400h-UI-layout-v035-pixel-v2.json';
        link.click();
        setTimeout(() => URL.revokeObjectURL(url),1000);
        status('JSON 已导出；参考图未写入运行布局',false);
      }

      function restoreImport() {
        try {
          const raw = localStorage.getItem(IMPORT_KEY);
          if (!raw) throw new Error('还没有导入过布局');
          project = normalizeV2(JSON.parse(raw));
          attachProject(project);
          selectedId = null;
          history = []; historyIndex = -1; pushHistory();
          bindProjectControls(); populateGlyphChars(); rebuildLayerList(); rebuildInspector(); renderGlyphEditor(); render();
          status('已恢复到最近一次导入版本',false);
        } catch (error) {
          status('无法恢复：' + error.message,true);
        }
      }

      function commitReference(key,visibleId,opacityId) {
        project.references[key].visible = $(visibleId).checked;
        project.references[key].opacity = Number($(opacityId).value);
        pushHistory(); render();
      }

      function setPreviewBinding(name,value) {
        project.preview[name] = value;
        if (name === 'soc' && !startup) { targetSoc = value; transition('soc',value,300); }
        if (name === 'hvPower' && !startup) { targetPower = value; transition('power',value,300); }
        if (name === 'speed') {
          wheelTargetSpeed = value <= 0 ? 0 : clamp(value,0,120) / 120 * 2.5;
          if (value <= 0) {
            wheelVisualSpeed = 0; transitions.wheel = null; wheelAngle = 0; requestRender();
          } else transition('wheel',wheelTargetSpeed,300);
        }
        updateOutputs(); saveLocal(); requestRender();
      }

      function bindEvents() {
        document.querySelectorAll('[data-tool]').forEach(button => button.addEventListener('click',() => chooseTool(button.dataset.tool)));
        document.querySelectorAll('[data-zoom]').forEach(button => button.addEventListener('click',() => setZoom(Number(button.dataset.zoom))));
        $('fitBtn').addEventListener('click',fitCanvas);
        $('undoBtn').addEventListener('click',() => restoreHistory(historyIndex-1));
        $('redoBtn').addEventListener('click',() => restoreHistory(historyIndex+1));
        $('importBtn').addEventListener('click',() => $('importFile').click());
        $('importFile').addEventListener('change',() => { if ($('importFile').files[0]) importJson($('importFile').files[0]); });
        $('exportBtn').addEventListener('click',exportJson);
        $('restoreBtn').addEventListener('click',restoreImport);
        $('previewBtn').addEventListener('click',() => {
          const active = document.body.classList.toggle('clean-preview');
          $('previewBtn').textContent = active ? '返回编辑' : '干净预览';
          setTimeout(fitCanvas,0);
          render();
        });
        $('leftBtn').addEventListener('click',() => {
          document.body.classList.toggle('left-collapsed');
          $('leftPanel').classList.toggle('collapsed');
          setTimeout(fitCanvas,0);
        });
        $('rightBtn').addEventListener('click',() => {
          document.body.classList.toggle('right-collapsed');
          $('rightPanel').classList.toggle('collapsed');
          setTimeout(fitCanvas,0);
        });

        $('layoutTab').addEventListener('click',() => {
          $('layoutTab').classList.add('active'); $('glyphTab').classList.remove('active');
          $('layoutPane').classList.remove('hidden'); $('glyphPane').classList.add('hidden');
        });
        $('glyphTab').addEventListener('click',() => {
          $('glyphTab').classList.add('active'); $('layoutTab').classList.remove('active');
          $('glyphPane').classList.remove('hidden'); $('layoutPane').classList.add('hidden');
          renderGlyphEditor();
        });
        $('glyphSet').addEventListener('change',() => { populateGlyphChars(); renderGlyphEditor(); });
        $('glyphChar').addEventListener('change',renderGlyphEditor);
        $('glyphPencil').addEventListener('click',() => {
          glyphTool='pencil'; $('glyphPencil').classList.add('active'); $('glyphErase').classList.remove('active');
        });
        $('glyphErase').addEventListener('click',() => {
          glyphTool='erase'; $('glyphErase').classList.add('active'); $('glyphPencil').classList.remove('active');
        });
        let glyphDrawing = false;
        glyphCanvas.addEventListener('pointerdown',event => {
          glyphDrawing=true; glyphCanvas.setPointerCapture(event.pointerId); paintGlyph(event);
        });
        glyphCanvas.addEventListener('pointermove',event => { if(glyphDrawing) paintGlyph(event); });
        glyphCanvas.addEventListener('pointerup',event => {
          glyphDrawing=false;
          if(glyphCanvas.hasPointerCapture(event.pointerId)) glyphCanvas.releasePointerCapture(event.pointerId);
          pushHistory();
        });

        screen.addEventListener('pointerdown',beginCanvasPointer);
        screen.addEventListener('pointermove',moveCanvasPointer);
        screen.addEventListener('pointerup',endCanvasPointer);
        screen.addEventListener('pointercancel',endCanvasPointer);
        screen.addEventListener('dragover',event => event.preventDefault());
        screen.addEventListener('drop',placeSettings);
        $('unplacedSettings').addEventListener('dragstart',event => event.dataTransfer.setData('text/plain','settings-button'));

        $('refTopVisible').addEventListener('change',() => commitReference('top','refTopVisible','refTopOpacity'));
        $('refTopOpacity').addEventListener('input',() => { project.references.top.opacity=Number($('refTopOpacity').value); requestRender(); });
        $('refTopOpacity').addEventListener('change',() => commitReference('top','refTopVisible','refTopOpacity'));
        $('refSideVisible').addEventListener('change',() => commitReference('side','refSideVisible','refSideOpacity'));
        $('refSideOpacity').addEventListener('input',() => { project.references.side.opacity=Number($('refSideOpacity').value); requestRender(); });
        $('refSideOpacity').addEventListener('change',() => commitReference('side','refSideVisible','refSideOpacity'));
        $('refBarVisible').addEventListener('change',() => commitReference('bar','refBarVisible','refBarOpacity'));
        $('refBarOpacity').addEventListener('input',() => { project.references.bar.opacity=Number($('refBarOpacity').value); requestRender(); });
        $('refBarOpacity').addEventListener('change',() => commitReference('bar','refBarVisible','refBarOpacity'));

        $('socRange').addEventListener('input',() => setPreviewBinding('soc',Number($('socRange').value)));
        $('speedRange').addEventListener('input',() => setPreviewBinding('speed',Number($('speedRange').value)));
        $('powerRange').addEventListener('input',() => setPreviewBinding('hvPower',Number($('powerRange').value)));
        $('idleToggle').addEventListener('change',() => {
          project.preview.idle=$('idleToggle').checked; updateOutputs(); saveLocal(); render();
        });
        $('simulateBtn').addEventListener('click',() => {
          transitions.soc=null; transitions.power=null;
          displayedSoc=0; displayedPower=0;
          startup={startedAt:performance.now(),socGoal:Number(project.preview.soc),powerGoal:Number(project.preview.hvPower)};
          animationLoop();
        });

        [
          ['scanOpacity','scanlineOpacity'],['scanWidth','scanlineWidthPx'],['scanGap','scanlineGapPx'],
          ['glowIntensity','glowIntensity'],['glowRadius','glowRadiusPx']
        ].forEach(pair => {
          $(pair[0]).addEventListener('input',() => {
            project.effects[pair[1]]=Number($(pair[0]).value); updateOutputs(); requestRender();
          });
          $(pair[0]).addEventListener('change',pushHistory);
        });

        document.addEventListener('keydown',event => {
          if (event.key === 'Escape' && document.body.classList.contains('clean-preview')) {
            document.body.classList.remove('clean-preview'); $('previewBtn').textContent='干净预览'; setTimeout(fitCanvas,0); render(); return;
          }
          if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
          if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase()==='z') {
            event.preventDefault(); restoreHistory(event.shiftKey ? historyIndex+1 : historyIndex-1); return;
          }
          const layer=selectedLayer();
          if (!layer || layer.locked) return;
          const moves={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
          if (moves[event.key]) {
            event.preventDefault(); layer.x+=moves[event.key][0]; layer.y+=moves[event.key][1];
            pushHistory(); rebuildInspector(); rebuildLayerList(); render();
          }
        });

        window.addEventListener('resize',() => setTimeout(fitCanvas,0));
      }

      async function init() {
        await document.fonts.ready;
        try {
          const raw=localStorage.getItem(STORAGE_KEY);
          project=raw ? normalizeV2(JSON.parse(raw)) : createDefaultProject();
        } catch (_) {
          project=createDefaultProject();
        }
        attachProject(project);
        displayedSoc=Number(project.preview.soc);
        targetSoc=displayedSoc;
        displayedPower=Number(project.preview.hvPower);
        targetPower=displayedPower;
        wheelTargetSpeed=clamp(Number(project.preview.speed),0,120)/120*2.5;
        wheelVisualSpeed=wheelTargetSpeed;
        bindEvents();
        bindProjectControls();
        populateGlyphChars();
        rebuildLayerList();
        rebuildInspector();
        renderGlyphEditor();
        history=[snapshot()];
        historyIndex=0;
        updateUndoButtons();
        fitCanvas();
        render();
        if (wheelVisualSpeed>0) animationLoop();
        status('已载入 640×360 像素布局；只保存在本机',false);
      }

      init();
    })();
  </script>
</body>
</html>
